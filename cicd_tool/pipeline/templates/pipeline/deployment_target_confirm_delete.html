{% extends 'pipeline/base.html' %}
{% block content %}
<style>
    .confirm-card {
        max-width: 520px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 2rem;
    }
    .confirm-title {
        font-size: 1.1rem; font-weight: 600; color: var(--text-primary);
        margin: 0 0 0.75rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .confirm-title i { color: var(--danger-color); }
    .confirm-body { font-size: 0.87rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem; }
    .confirm-body strong { color: var(--text-primary); }
    .actions { display: flex; gap: 0.75rem; }
    .btn {
        display: inline-flex; align-items: center; gap: 0.4rem;
        border-radius: 6px; padding: 0.42rem 0.85rem; font-size: 0.78rem;
        font-weight: 700; cursor: pointer; font-family: inherit;
        border: 1px solid transparent; text-decoration: none; transition: var(--transition);
        box-shadow: var(--shadow-sm);
    }
    .btn-danger  { background: #dc2626; color: #ffffff; border-color: #dc2626; }
    .btn-danger:hover { background: #b91c1c; border-color: #b91c1c; }
    .btn-outline { background: #ffffff; color: var(--text-primary); border-color: var(--border-color); font-weight: 600; }
    .btn-outline:hover { background: var(--canvas-bg); border-color: var(--btn-dark); color: var(--btn-dark); }
</style>

<div class="confirm-card">
    <h1 class="confirm-title"><i class="ph ph-warning"></i> Delete Deployment Target</h1>
    <div class="confirm-body">
        Are you sure you want to delete <strong>{{ target.name }}</strong>
        (<em>{{ target.get_target_type_display }}</em>)?
        This action cannot be undone. Any pipeline steps referencing this target will fail.
    </div>
    <div class="actions">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="ph ph-trash"></i> Yes, Delete
            </button>
        </form>
        <a href="{% url 'deployment_target_detail' target.pk %}" class="btn btn-outline">Cancel</a>
    </div>
</div>
{% endblock %}
