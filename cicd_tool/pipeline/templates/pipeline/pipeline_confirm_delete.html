{% extends 'pipeline/base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Pipeline {{ pipeline.name }}</title>
</head>
<body>
    <h1>Delete Pipeline {{ pipeline.name }}</h1>
    <p>Are you sure you want to delete this pipeline?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
    </form>
    <a href="{% url 'pipeline_list' project.id %}">Cancel</a>
</body>
</html>
{% endblock %}
