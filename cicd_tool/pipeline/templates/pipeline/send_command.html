<!-- send_command.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Command</title>
</head>
<body>
    <h1>Send Command</h1>
    <form action="{% url 'send_command' %}" method="post">
        {% csrf_token %}
        <label for="hostname">Hostname:</label>
        <input type="text" id="hostname" name="hostname"><br><br>
        <label for="command">Command:</label>
        <input type="text" id="command" name="command"><br><br>
        <input type="submit" value="Send">
    </form>
</body>
</html>
