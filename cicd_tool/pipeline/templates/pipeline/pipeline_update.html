<!-- pipeline_update.html -->

{% extends 'pipeline/base.html' %}


{% block content %}
  <h2>Update Pipeline</h2>
  <form method="post">
    {% csrf_token %}
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" value="{{ pipeline.name }}" required><br>
    <label for="description">Description:</label><br>
    <textarea id="description" name="description">{{ pipeline.description }}</textarea><br>
    <button type="submit">Update</button>
  </form>
{% endblock %}
