<!-- global_credential_list.html -->
{% extends 'pipeline/base.html' %}

{% block content %}
<h1>Global Credentials</h1>
<ul>
  {% for credential in credentials %}
    <li><a href="{% url 'global_credential_detail' credential.pk %}">{{ credential.service_name }}</a></li>
  {% endfor %}
</ul>
<a href="{% url 'global_credential_create' %}">Create New Credential</a>
{% endblock %}
