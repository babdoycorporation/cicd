{% extends 'pipeline/base.html' %}

{% block content %}
<div class="container mt-4">
    <style>
        .application-list-container {
            width: 150px; /* Fixed width */
            height: 150px; /* Fixed height */
            overflow-y: auto; /* Add scrollbar if content exceeds height */
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            padding: 10px;
            margin: 0 auto; /* Center the container */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .application-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        .application-list li {
            margin-bottom: 5px;
        }

        .application-list li a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

        .application-list li a:hover {
            color: #007bff;
        }

        .no-applications {
            color: #999;
            text-align: center;
            padding: 20px 0;
            width: 100%;
        }
    </style>
    <div class="application-list-container">
        {% if applications %}
            <ul class="application-list">
                {% for application in applications %}
                    <li><a href="{% url 'application_detail' application.id %}">{{ application.name }}</a></li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="no-applications">No applications available.</div>
        {% endif %}
    </div>
</div>
{% endblock %}
