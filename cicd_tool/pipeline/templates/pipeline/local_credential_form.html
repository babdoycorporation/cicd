{% extends 'pipeline/base.html' %}

{% block content %}
<style>
    .page-header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
    }

    .page-title {
        font-size: 1.75rem;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-primary);
    }

    .glass-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        max-width: 600px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-primary);
    }

    .form-group input[type="text"],
    .form-group input[type="password"] {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        transition: all 0.2s ease;
    }

    .form-group input[type="text"]:focus,
    .form-group input[type="password"]:focus {
        outline: none;
        border-color: var(--accent-color);
        background-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.2);
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border-color);
    }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s;
        cursor: pointer;
        border: 1px solid transparent;
        font-family: 'Inter', sans-serif;
    }

    .btn-primary {
        background-color: var(--accent-color);
        color: white;
    }

    .btn-primary:hover {
        background-color: #1f6feb;
    }
    
    .btn-secondary {
        background-color: transparent;
        border-color: var(--border-color);
        color: var(--text-primary);
    }

    .btn-secondary:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }
</style>

<div>
    <div class="page-header">
        <h1 class="page-title">
            <i class="ph ph-shield-plus"></i> {% if form.instance.pk %}Update{% else %}Create{% endif %} Local Credential
        </h1>
    </div>

    <div class="glass-card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_service_name"><i class="ph ph-hard-drives"></i> Service Name</label>
                {{ form.service_name }}
            </div>
            <div class="form-group">
                <label for="id_username"><i class="ph ph-user"></i> Username</label>
                {{ form.username }}
            </div>
            <div class="form-group">
                <label for="id_password"><i class="ph ph-lock-key"></i> Password</label>
                {{ form.password }}
            </div>
            <div class="form-group">
                <label for="id_token"><i class="ph ph-key"></i> Token</label>
                {{ form.token }}
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="ph ph-floppy-disk"></i> Save Credential
                </button>
                <a href="javascript:history.back()" class="btn btn-secondary">
                    <i class="ph ph-x"></i> Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
