{% extends 'pipeline/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Projects</h1>
    <a href="{% url 'project_create' %}" class="btn btn-primary mb-3">Add New Project</a>
    <ul class="list-group">
        {% for project in projects %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'project_detail' project.id %}" class="font-weight-bold">{{ project.name }}</a>
            <div class="btn-group" role="group">
                <a href="{% url 'project_edit' project.id %}" class="btn btn-sm btn-secondary">Edit</a>
                <a href="{% url 'project_delete' project.id %}" class="btn btn-sm btn-danger">Delete</a>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
