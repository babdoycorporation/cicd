<!-- local_credential_list.html -->
{% extends 'pipeline/base.html' %}

{% block content %}
<h1>Local Credentials</h1>
<ul>
  {% for credential in credentials %}
    <li><a href="{% url 'local_credential_detail' credential.pk %}">{{ credential.service_name }}</a></li>
  {% endfor %}
</ul>
<a href="{% url 'local_credential_create' project_id=project_id %}">Create New Credential</a>
{% endblock %}
