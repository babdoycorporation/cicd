<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReleaseRocket - GitOps Platform</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* General Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            color: #333;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar Styles */
        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #2c3e50;
            padding-top: 20px;
            overflow-x: hidden;
            color: white;
            transition: width 0.3s;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar a {
            padding: 15px;
            text-decoration: none;
            font-size: 1rem;
            color: white;
            display: flex;
            align-items: center;
            transition: background-color 0.3s, padding 0.3s;
        }

        .sidebar a .icon {
            margin-right: 10px;
            font-size: 1.2rem;
            min-width: 25px;
        }

        .sidebar.collapsed a {
            justify-content: center;
            padding: 15px 0;
        }

        .sidebar.collapsed a .text {
            display: none;
        }

        .sidebar a:hover {
            background-color: #34495e;
        }

        /* Sidebar Toggler */
        .sidebar-toggler {
            position: fixed;
            top: 20px;
            left: 250px;
            border: none;
            background: none;
            color: #333;
            font-size: 1.5rem;
            transition: left 0.3s;
            cursor: pointer;
            z-index: 1000;
        }

        .sidebar-toggler.collapsed {
            left: 80px;
        }

        /* Content Area */
        .content {
            margin-left: 250px;
            padding: 20px;
            transition: margin-left 0.3s;
        }

        .content.collapsed {
            margin-left: 80px;
        }

        /* GitOps Theme Colors */
        .gitops-primary {
            color: #3498db;
        }

        .gitops-secondary {
            color: #2ecc71;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }

            .sidebar.collapsed {
                width: 0;
            }

            .content {
                margin-left: 80px;
            }

            .content.collapsed {
                margin-left: 0;
            }

            .sidebar-toggler {
                left: 80px;
            }

            .sidebar-toggler.collapsed {
                left: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="{% url 'dashboard' %}">
            <i class="fas fa-rocket icon gitops-primary"></i>
            <span class="text">ReleaseRocket</span>
        </a>
        <a href="{% url 'dashboard' %}">
            <i class="fas fa-tachometer-alt icon gitops-secondary"></i>
            <span class="text">Dashboard</span>
        </a>
        <a href="{% url 'project_list' %}">
            <i class="fas fa-project-diagram icon gitops-secondary"></i>
            <span class="text">Projects</span>
        </a>
        <a href="{% url 'agent_list' %}">
            <i class="fas fa-users icon gitops-secondary"></i>
            <span class="text">Agents</span>
        </a>
        <a href="{% url 'global_credential_list' %}">
            <i class="fas fa-key icon gitops-secondary"></i>
            <span class="text">Credentials</span>
        </a>
        <a href="{% url 'application_list' %}">
            <i class="fas fa-cube icon gitops-secondary"></i>
            <span class="text">Applications</span>
        </a>
        <a href="{% url 'create_yaml_pipeline' %}">
            <i class="fas fa-file-code icon gitops-secondary"></i>
            <span class="text">Pipelines</span>
        </a>
        <a href="{% url 'repository_list' %}">
            <i class="fas fa-code-branch icon gitops-secondary"></i>
            <span class="text">Repositories</span>
        </a>
    </div>

    <!-- Sidebar Toggler -->
    <button class="sidebar-toggler" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Content -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script>
        // Toggle Sidebar
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const content = document.querySelector('.content');
            const sidebarToggler = document.querySelector('.sidebar-toggler');

            sidebar.classList.toggle('collapsed');
            content.classList.toggle('collapsed');
            sidebarToggler.classList.toggle('collapsed');
        }
    </script>
</body>
</html>
