{% extends 'pipeline/base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if pipeline %}Update{% else %}Create{% endif %} Pipeline for {{ project.name }}</title>
</head>
<body>
    <h1>{% if pipeline %}Update{% else %}Create{% endif %} Pipeline</h1>
    <form method="post">
        {% csrf_token %}
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{% if pipeline %}{{ pipeline.name }}{% endif %}" required><br>
        <label for="description">Description:</label>
        <textarea id="description" name="description">{% if pipeline %}{{ pipeline.description }}{% endif %}</textarea><br>
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'pipeline_list' project.id %}">Back to Pipelines</a>
</body>
</html>
{% endblock %}
