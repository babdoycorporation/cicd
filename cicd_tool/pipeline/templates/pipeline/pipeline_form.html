{% extends 'pipeline/base.html' %}

{% block content %}
<div class="container">
    <h1>{% if pipeline %}Update{% else %}Create{% endif %} Pipeline for {{ project.name }}</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" class="form-control" id="name" name="name" value="{% if pipeline %}{{ pipeline.name }}{% endif %}" required>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea class="form-control" id="description" name="description">{% if pipeline %}{{ pipeline.description }}{% endif %}</textarea>
        </div>
        <div class="form-group">
            <label for="application">Application:</label>
            <select class="form-control" id="application" name="application" required>
                <option value="">Select an application</option>
                {% for application in applications %}
                    <option value="{{ application.id }}"
                        {% if application.id in pipeline_application_ids %} selected {% endif %}>
                        {{ application.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="{% url 'pipeline_list' project.id %}" class="btn btn-secondary">Back to Pipelines</a>
</div>
{% endblock %}
