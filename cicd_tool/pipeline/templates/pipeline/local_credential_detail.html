{% extends 'pipeline/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Local Credential Detail</h1>
    <div class="card">
        <div class="card-body">
            <p><strong>Name:</strong> {{ credential.service_name }}</p>
            <p><strong>Username:</strong> {{ credential.username }}</p>
            <p><strong>Password:</strong> *********</p> <!-- Masked password -->
            <!-- Add other fields as needed -->
        </div>
    </div>
    <a href="{% url 'local_credential_update' credential.pk %}" class="btn btn-secondary mt-3">Edit Credential</a>
    <a href="{% url 'local_credential_delete' credential.pk %}" class="btn btn-danger mt-3">Delete Credential</a>
</div>
{% endblock %}
