<!DOCTYPE html>
<html>

<head>
    <title>Organizations | Release Rocket</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6e44ff;
            --secondary: #b892ff;
            --dark: #0f0e17;
            --card: #16161a;
            --light: #fffffe;
            --border: #242629;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--dark);
            color: var(--light);
        }

        .navbar {
            padding: 1rem 5%;
            background: rgba(15, 14, 23, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--light);
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .org-info h2 {
            margin: 0;
            font-size: 1.25rem;
        }

        .org-info p {
            margin: 0.3rem 0 0;
            color: #a7a9be;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="{% url 'repository_list' %}"
            style="font-size: 1.5rem; font-weight: 800; color: white; text-decoration: none;">Release Rocket</a>
    </nav>

    <div class="container">
        <div class="header-box">
            <h1>Your Organizations</h1>
            <a href="{% url 'create_organization' %}" class="btn btn-primary">Create Organization</a>
        </div>

        {% for org in organizations %}
        <a href="{% url 'organization_detail' org.id %}" class="card">
            <div class="org-info">
                <h2>{{ org.name }}</h2>
                <p>{{ org.description|truncatewords:20 }}</p>
            </div>
            <i class="fas fa-chevron-right" style="color: #444;"></i>
        </a>
        {% empty %}
        <div style="text-align: center; padding: 4rem; color: #a7a9be;">
            <i class="fas fa-building" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.3;"></i>
            <p>You don't belong to any organizations yet.</p>
        </div>
        {% endfor %}
    </div>
</body>

</html>
