{% extends 'pipeline/base.html' %}

{% block content %}
<style>
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border-color);
  }
  .page-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--text-primary);
  }
  .btn-primary {
    background: #238636; color: #fff; border: 1px solid #2ea043;
    border-radius: 6px; padding: 0.5rem 1.1rem; font-size: 0.88rem;
    font-weight: 500; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; gap: 0.4rem;
    transition: background 0.2s; text-decoration: none;
  }
  .btn-primary:hover { background: #2ea043; }
  .org-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 0.75rem;
    text-decoration: none;
    color: var(--text-primary);
    transition: border-color 0.2s, transform 0.15s;
  }
  .org-card:hover {
    border-color: var(--accent-color);
    transform: translateX(3px);
    color: var(--text-primary);
  }
  .org-name { font-size: 1.05rem; font-weight: 600; }
  .org-desc { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem; }
</style>

<div class="page-header">
  <h1 class="page-title"><i class="ph ph-buildings"></i> Organizations</h1>
  <a href="{% url 'create_organization' %}" class="btn-primary">
    <i class="ph ph-plus"></i> New Organization
  </a>
</div>

{% for org in organizations %}
<a href="{% url 'organization_detail' org.id %}" class="org-card">
  <div>
    <div class="org-name">{{ org.name }}</div>
    <div class="org-desc">{{ org.description|truncatewords:20 }}</div>
  </div>
  <i class="ph ph-caret-right" style="color: var(--text-secondary);"></i>
</a>
{% empty %}
<div style="text-align:center; padding: 4rem; color: var(--text-secondary); background: var(--card-bg); border: 1px dashed var(--border-color); border-radius: 10px;">
  <i class="ph ph-buildings" style="font-size: 3rem; opacity: 0.3; display: block; margin-bottom: 1rem;"></i>
  <p style="margin:0 0 1rem;">You don't belong to any organizations yet.</p>
  <a href="{% url 'create_organization' %}" class="btn-primary">Create your first organization</a>
</div>
{% endfor %}
{% endblock %}
