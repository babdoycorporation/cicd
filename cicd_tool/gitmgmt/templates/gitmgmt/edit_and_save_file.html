
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit File - {{ file_path }}</title>
    <style>

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .branch-info {
            font-size: 14px;
            color: #586069;
        }

        .editor-container {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #editor {
            height: 500px;
        }

        .commit-section {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #2ea44f;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #2c974b;
        }

        .alert {
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .alert-success {
            background-color: #dcffe4;
            border: 1px solid #bef5cb;
            color: #165c26;
        }

        .alert-error {
            background-color: #ffeef0;
            border: 1px solid #ffdce0;
            color: #86181d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Editing: {{ file_path }}</h1>
            <div class="branch-info">
                Current Branch: <span id="current-branch">{{ current_branch }}</span>
            </div>
        </div>

        <div id="alert" style="display: none;"></div>

        <div class="editor-container">
            <div id="editor"></div>
        </div>

        <div class="commit-section">
            <input type="hidden" id="repository-id" value="{{ repository.id }}">
            <input type="hidden" id="file-path" value="{{ file_path }}">

            <label for="commit_message">Commit Message:</label>
            <input type="text" id="commit_message" name="commit_message" placeholder="Enter a commit message">

            <button type="button" id="save-btn">Commit changes</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.30.1/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.30.1/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            var editor = monaco.editor.create(document.getElementById('editor'), {
                value: `{{ file_content|safe }}`,
                language: 'python', // Change this based on the file type
                theme: 'vs-dark',
                automaticLayout: true
            });

            document.getElementById('save-btn').addEventListener('click', function() {
                var repositoryId = document.getElementById('repository-id').value;
                var filePath = document.getElementById('file-path').value;
                var fileContent = editor.getValue();
                var commitMessage = document.getElementById('commit_message').value;
                var currentBranch = document.getElementById('current-branch').textContent;

                fetch(`/gitmgmt/repositories/${repositoryId}/edit/${filePath}/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({
                        code: fileContent,
                        commit_message: commitMessage,
                        branch: currentBranch
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showAlert('File saved successfully', 'success');
                        // Update the editor content with the latest version from the server
                        editor.setValue(data.updated_content);
                    } else {
                        showAlert('Failed to save file: ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showAlert('An error occurred while saving the file', 'error');
                });
            });

            function showAlert(message, type) {
                var alertElement = document.getElementById('alert');
                alertElement.textContent = message;
                alertElement.className = 'alert alert-' + type;
                alertElement.style.display = 'block';

                setTimeout(function() {
                    alertElement.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
{% endblock %}
