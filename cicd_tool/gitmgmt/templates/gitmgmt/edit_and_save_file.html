{% extends 'pipeline/base.html' %}
{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit and Save File</title>
    <!-- Include CodeMirror stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/codemirror.min.css">
    <!-- Include CodeMirror themes if needed -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/theme/monokai.min.css">
    <!-- Include custom CSS for layout and styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 400px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        label {
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
            align-self: center;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Edit and Save File</h1>
    <!-- Commit message input -->
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="repository_id" value="{{ repository.id }}">
        <input type="hidden" name="file_path" value="{{ file_path }}">

        <!-- CodeMirror text area for editing code -->
        <textarea id="code" name="code">{{ file_content }}</textarea>

        <label for="commit_message">Commit Message:</label>
        <input type="text" id="commit_message" name="commit_message" value="">
        <button type="submit">Save Changes</button>
    </form>
</div>

<!-- Include CodeMirror JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/codemirror.min.js"></script>
<!-- Include required CodeMirror mode (e.g., for Python) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/mode/python/python.min.js"></script>

<!-- Include CodeMirror add-ons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.63.1/addon/selection/active-line.min.js"></script>

<script>
    // Initialize CodeMirror instance
    var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
        lineNumbers: true,
        mode: "python", // Change this to the appropriate language mode
        theme: "monokai",
        matchBrackets: true,
        autoCloseBrackets: true,
        styleActiveLine: true
    });
</script>

</body>
</html>
{% endblock %}
