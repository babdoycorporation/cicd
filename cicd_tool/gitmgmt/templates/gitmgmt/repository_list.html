<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Repository Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-bg: #0d1117;
            --darker-bg: #010409;
            --card-bg: #161b22;
            --highlight-bg: #1e293b;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #7d8590;
            --accent-color: #2f81f7;
            --star-color: #f1e05a;
            --success-color: #3fb950;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .repository-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .create-link {
            background-color: var(--success-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .create-link:hover {
            background-color: #2ea043;
        }

        .search-form {
            flex-grow: 1;
            max-width: 500px;
        }

        .search-form input[type="text"] {
            width: 100%;
            padding: 0.5rem 1rem;
            background-color: var(--darker-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .search-form input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(47, 129, 247, 0.3);
        }

        .row {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .column {
            flex: 1;
        }

        h3 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .repository-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .repository-list li {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .repository-list li:hover {
            border-color: var(--accent-color);
        }

        .repository-list a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .repository-list a:hover {
            text-decoration: underline;
            color: #58a6ff;
        }

        .favorite-button {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem;
            transition: all 0.2s;
        }

        .favorite-button:hover {
            transform: scale(1.1);
        }

        .fa-star {
            color: var(--star-color);
        }

        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
            
            .action-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-form {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="repository-container">
        <div class="header-section">
            <h2>Repositories</h2>
            
            <div class="action-bar">
                <a href="{% url 'create_repository' %}" class="create-link">
                    <i class="fas fa-plus"></i> New
                </a>
                
                <form method="get" action="" class="search-form">
                    <input type="text" name="q" placeholder="Find a repository..." value="{{ request.GET.q }}">
                </form>
            </div>
        </div>
        
        <div class="row">
            <div class="column">
                <h3>All Repositories</h3>
                <ul class="repository-list">
                    {% for repository in repositories %}
                        <li>
                            <a href="{% url 'repository_detail' repository.id %}">
                                <i class="fas fa-book"></i> {{ repository.name }}
                            </a>
                            <form method="post" action="{% url 'toggle_favorite' repository.id %}" style="display:inline;">
                                {% csrf_token %}
                                <button type="submit" class="favorite-button">
                                    {% if repository.is_favorite %}
                                        <i class="fas fa-star"></i>
                                    {% else %}
                                        <i class="far fa-star"></i>
                                    {% endif %}
                                </button>
                            </form>
                        </li>
                    {% endfor %}
                </ul>
            </div>
            <div class="column">
                <h3><i class="fas fa-star"></i> Favorites</h3>
                <ul class="repository-list">
                    {% for repository in favorites %}
                        <li>
                            <a href="{% url 'repository_detail' repository.id %}">
                                <i class="fas fa-book"></i> {{ repository.name }}
                            </a>
                            <form method="post" action="{% url 'toggle_favorite' repository.id %}" style="display:inline;">
                                {% csrf_token %}
                                <button type="submit" class="favorite-button">
                                    <i class="fas fa-star"></i>
                                </button>
                            </form>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
