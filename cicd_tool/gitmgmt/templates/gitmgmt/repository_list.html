{% extends 'pipeline/base.html' %}
{% block content %}
<div class="repository-container">
    <style>
        .repository-container {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
        }
        h2 {
            font-size: 24px;
            font-weight: 400;
            color: #24292e;
            margin-bottom: 20px;
        }
        .search-form {
            margin-bottom: 20px;
        }
        .search-form input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #e1e4e8;
            font-size: 16px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            margin-bottom: 10px;
        }
        ul li a {
            text-decoration: none;
            color: #0366d6;
            font-weight: 600;
        }
        ul li a:hover {
            text-decoration: underline;
        }
        .create-link {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
        .create-link:hover {
            background-color: #218838;
        }
    </style>
    <h2>Repositories</h2>
    <a href="{% url 'create_repository' %}" class="create-link">Create New Repository</a>
    <form method="get" action="" class="search-form">
        <input type="text" name="q" placeholder="Search repositories..." value="{{ request.GET.q }}">
    </form>
    <ul>
        {% for repository in repositories %}
            <li><a href="{% url 'repository_detail' repository.id %}">{{ repository.name }}</a></li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
