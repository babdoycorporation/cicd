<!-- upload_file.html -->

{% extends 'pipeline/base.html' %}
{% block content %}
<!-- upload_file.html -->

<div class="upload-file-page">
    <div class="upload-file-container">
        <div class="content">
            <h2>Upload File to {{ repository.name }}</h2>

            <div class="section">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="id_file">Select File:</label>
                        <input type="file" name="file" id="id_file" required>
                    </div>
                    <div class="form-group">
                        <label for="id_commit_message">Commit Message:</label>
                        <input type="text" id="id_commit_message" name="commit_message">
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
            </div>

            <a href="{% url 'repository_detail' repository_id=repository.id %}" class="back-link">Back to Repository</a>
        </div>
    </div>
</div>

{% endblock %}
