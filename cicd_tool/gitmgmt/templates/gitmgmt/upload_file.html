
{% block content %}
<style>
  .card {
    border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  .card-header {
    background-color: #28a745;
    color: white;
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
  }
  .btn-primary {
    background-color: #28a745;
    border-color: #28a745;
  }
  .btn-primary:hover {
    background-color: #218838;
    border-color: #1e7e34;
  }
  .text-decoration-none {
    color: #28a745;
  }
  .text-decoration-none:hover {
    color: #1e7e34;
  }
</style>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">Upload File to {{ repository.name }}</h4>
        </div>
        <div class="card-body">
          {% if messages %}
            <div class="alert alert-danger">
              {% for message in messages %}
                <p class="mb-0">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
          
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Ensure branch is set, fallback to main -->
            <input type="hidden" name="current_branch" value="{{ request.GET.branch|default:'main' }}">
        
            <div class="mb-3">
                <label for="id_file" class="form-label">Select File:</label>
                <input type="file" name="file" id="id_file" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="id_commit_message" class="form-label">Commit Message:</label>
                <input type="text" id="id_commit_message" name="commit_message" class="form-control" placeholder="Enter commit message">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Upload</button>
            </div>
        </form>
        
        </div>
      </div>
      <div class="mt-3 text-center">
        <a href="{% url 'repository_detail' repository_id=repository.name %}?branch={{ request.GET.branch }}" class="text-decoration-none">
          <i class="bi bi-arrow-left me-2"></i>Back to Repository
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
