<!DOCTYPE html>
<html>

<head>
    <title>Create Organization | Release Rocket</title>
    <style>
        :root {
            --primary: #6e44ff;
            --dark: #0f0e17;
            --border: #242629;
            --light: #fffffe;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #16161a;
            padding: 2.5rem;
            border-radius: 12px;
            width: 400px;
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #a7a9be;
        }

        input,
        textarea {
            width: 100%;
            background: #242629;
            border: 2px solid #36383d;
            border-radius: 8px;
            padding: 0.8rem;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>New Organization</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="e.g. Acme Corp" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="3" placeholder="What's this org about?"></textarea>
            </div>
            <button type="submit" class="btn">Create Organization</button>
        </form>
    </div>
</body>

</html>
